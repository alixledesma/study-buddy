<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio Licencia 2-14 Florida</title>
<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#1f2a24; --sub:#5b6b62;
  --line:#e2e1da; --accent:#0d6e4f; --accent2:#c8971f; --bad:#b3413a; --good:#0d6e4f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141814;--card:#1d231d;--ink:#eef0ea;--sub:#9db09f;--line:#2c352c;}
}
:root[data-theme="dark"]{--bg:#141814;--card:#1d231d;--ink:#eef0ea;--sub:#9db09f;--line:#2c352c;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%}
header{padding:18px 16px 10px;text-align:center}
header h1{margin:0;font-size:1.25rem;color:var(--accent)}
header p{margin:4px 0 0;color:var(--sub);font-size:.85rem}
nav{display:flex;gap:6px;padding:8px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;overflow-x:auto}
nav button{flex:1;min-width:90px;padding:9px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:640px;margin:0 auto;padding:10px 14px 40px}
.view{display:none}
.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.acc-h{cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--accent)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .25s ease}
.acc-b.open{max-height:900px;margin-top:8px}
.acc-b ul{margin:0;padding-left:18px}
.acc-b li{margin-bottom:6px;font-size:.92rem;line-height:1.4}
select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px;font-size:.9rem}
.row{display:flex;gap:8px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;font-size:.9rem;cursor:pointer;flex:1}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.gold{background:var(--accent2)}
.fc{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1rem;padding:20px;cursor:pointer}
.fc .term{font-weight:800;color:var(--accent2);font-size:1.05rem}
.qopt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.9rem}
.qopt.correct{background:var(--good);color:#fff;border-color:var(--good)}
.qopt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.progress{font-size:.8rem;color:var(--sub);margin-bottom:6px}
.center{text-align:center}
footer{text-align:center;color:var(--sub);font-size:.75rem;padding:10px}
mark{background:var(--accent2);color:#fff;padding:0 2px;border-radius:3px}
.res-tag{font-size:.75rem;color:var(--sub);margin-bottom:4px}
</style>
</head>
<body>
<header>
<h1>📋 Licencia 2-14 Florida</h1>
<p>Guía, tarjetas y quiz de repaso</p>
</header>
<nav>
<button data-v="guia" class="active">Guía</button>
<button data-v="tarjetas">Tarjetas</button>
<button data-v="quiz">Quiz</button>
<button data-v="buddy">Asistente</button>
</nav>
<main>

<section id="guia" class="view active"></section>

<section id="tarjetas" class="view">
<select id="fcChap"></select>
<div class="card fc" id="fcCard"></div>
<div class="progress center" id="fcProg"></div>
<div class="row" style="margin-top:8px">
<button class="btn ghost" id="fcPrev">← Anterior</button>
<button class="btn" id="fcNext">Siguiente →</button>
</div>
</section>

<section id="quiz" class="view">
<div id="qSetup">
<select id="qChap"></select>
<button class="btn" id="qStart">Comenzar Quiz</button>
</div>
<div id="qPlay" style="display:none">
<div class="progress" id="qProg"></div>
<div class="card">
<div id="qText" style="font-weight:700;margin-bottom:10px"></div>
<div id="qOpts"></div>
</div>
<button class="btn gold" id="qNext" style="display:none">Siguiente →</button>
</div>
<div id="qEnd" style="display:none" class="card center">
<h3 id="qScore"></h3>
<button class="btn" id="qRestart">Repetir</button>
</div>
</section>

<section id="buddy" class="view">
<p style="color:var(--sub);font-size:.85rem;margin-top:0">Busca un término o palabra clave del examen 2-14 (ej. "recibo condicional", "MIB", "periodo de gracia") y te muestro los apuntes, tarjetas y preguntas relacionadas.</p>
<div class="row">
<input id="bdInput" placeholder="Escribe un término o palabra clave..." style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
<button class="btn" id="bdSend" style="flex:0 0 auto">Buscar</button>
</div>
<div id="bdMsgs" style="margin-top:12px;max-height:60vh;overflow-y:auto"></div>
</section>

</main>
<footer>Material de estudio no oficial · basado en tus apuntes del examen 2-14</footer>
<script>

tación, Partes competentes, Propósito legal."], "f": [{"t": "Interés asegurable", "d": "Debe existir al momento de solicitar la póliza, no al morir el asegurado."}, {"t": "MIB", "d": "Oficina de Información Médica: organización sin fines de lucro que comparte información médica desfavorable entre aseguradores."}, {"t": "Garantía", "d": "Declaración considerada absolutamente verdadera en la solicitud."}, {"t": "Representación", "d": "Declaración creída verdadera a leal saber y entender."}, {"t": "Recibo condicional", "d": "Cobertura inicia en la fecha de solicitud o examen médico (la más tardía) si el asegurado es asegurable."}, {"t": "STOLI/IOLI", "d": "Pólizas originadas para vender a inversionistas; no existe interés asegurable real."}, {"t": "Contrato de adhesión", "d": "Redactado por el asegurador; el asegurado solo acepta o rechaza."}, {"t": "Contrato aleatorio", "d": "Intercambio de valores desiguales entre asegurado y asegurador."}, {"t": "Contrato unilateral", "d": "Solo el asegurador está legalmente obligado a cumplir su promesa."}, {"t": "Contrato condicional", "d": "Requiere que se cumplan ciertas condiciones (pago de primas, prueba de pérdida) para ejecutarse."}, {"t": "Informe al consumidor", "d": "Informe general sobre finanzas, carácter, trabajo, aficiones y hábitos."}, {"t": "APS", "d": "Declaración del Médico de Cabecera; historial médico realizado por el médico del cliente."}], "q": [{"q": "La fuente básica de información que se utiliza durante el proceso de aseguramiento es:", "o": ["La Solicitud", "La MIB", "El Informe del consumidor", "La Declaración del agente"], "a": 0}, {"q": "El MIB es una organización sin fines de lucro que mantiene:", "o": ["Información sobre conducción de los candidatos", "Información médica de los candidatos", "Información sobre maternidad de las candidatas", "Información sobre los tipos de pólizas disponibles"], "a": 1}, {"q": "Los candidatos cuya salud, hábitos y ocupaciones son de mayor riesgo se denominan:", "o": ["Riesgos preferenciales", "Riesgos menores", "Riesgos subestándares", "Riesgos no deseados"], "a": 2}, {"q": "Los cambios realizados a una solicitud de seguro de vida deben ser:", "o": ["Inicializados por el agente solamente", "Aprobados por el vicepresidente regional de la compañía", "Inicializados por el agente o candidato", "Aprobados por los aseguradores"], "a": 2}, {"q": "¿Cuál de los siguientes detalla más claramente el proceso de suscripción para seguros de vida?", "o": ["Evaluación y clasificación de riesgos", "Selección y emisión de pólizas", "Selección del riesgo y proceso de clasificación", "Selección, informes y rechazo de riesgos"], "a": 2}, {"q": "¿Cuál es la fecha de inicio de cobertura para un candidato que ha recibido un recibo condicional?", "o": ["La fecha de la aplicación o del examen médico, la más tardía, si es asegurable", "La fecha en que el productor recibe la póliza", "La fecha en que el asegurador recibe la aplicación", "La fecha en que el productor entrega la póliza"], "a": 0}, {"q": "¿Cuándo se requiere que un productor obtenga una Declaración de Buena Salud firmada?", "o": ["Durante la entrega si el vistazo gratis comienza en la entrega", "Al momento de la solicitud", "Al momento del examen médico", "Durante la entrega si la aplicación se envió sin pagar la primera prima"], "a": 3}, {"q": "Todas las siguientes son verdaderas sobre interés asegurable, a excepción de:", "o": ["Un esposo o esposa tienen interés asegurable en el otro", "Un acreedor puede tener interés asegurable en un deudor, limitado al monto adeudado", "Debe existir en el momento de la reclamación entre beneficiario y asegurado", "Las personas tienen interés asegurable en ellas mismas"], "a": 2}, {"q": "¿Cuándo debe existir un interés asegurable?", "o": ["Al momento de la aplicación", "Cuando el beneficio por fallecimiento se vuelve pagadero", "Cuando la titularidad de la póliza es transferida", "Cuando se pide un préstamo sobre el valor en efectivo"], "a": 0}, {"q": "Una d "], "a": 2}, {"q": "¿Qué elemento de un contrato evita que se aproveche de menores o personas mentalmente incapacitadas?", "o": ["Oferta y aceptación", "Partes competentes", "Consejo y consentimiento", "Propósito legal"], "a": 1}]}, {"t": "Cap 2 · Tipos de pólizas de seguro de vida y anualidades", "b": ["📊 En el examen real: 15 de 85 preguntas (~18%) — 'Types of Policies'.", "Término nivelado: beneficio por muerte constante durante el periodo; paga solo si el asegurado fallece durante el término.", "Término decreciente: la cobertura disminuye en momentos predeterminados; ideal para hipotecas o seguros de crédito.", "Término anual renovable: el más básico; se renueva cada año sin prueba de asegurabilidad, primas aumentan con la edad.", "Vida entera ordinaria: monto nominal, prima y valor en efectivo garantizados hasta los 100 años; primas de por vida.", "Pago limitado: primas se pagan hasta cierta edad (ej. 20 Pay Life), pero la cobertura continúa hasta los 100 años.", "Vida universal: 2 flexibilidades (prima y monto nominal); 2 tasas de interés (mínima garantizada y actual); 2 opciones de beneficio por muerte.", "Vida entera variable: valor en efectivo invertido en cuenta separada, no garantizado; requiere doble licencia (seguros y FINRA/SEC).", "Vida universal variable: combina flexibilidad de universal con control de inversión de variable.", "Vida de patrimonio indexado: monto nominal ligado al desempeño de un índice (S&P 500) con tasa mínima garantizada y primas fijas.", "Vida mancomunada (primero en morir) vs vida con supervivencia (último en morir); ambas con 2+ asegurados en una póliza.", "Anualidad: no es seguro de vida, sino un método de liquidar un patrimonio; usa tablas de mortalidad con mayor expectativa de vida.", "Partes de la anualidad: Titular (dueño), Pensionado/Beneficiario (recibe pagos), Beneficiario designado (recibe si el titular muere en acumulación).", "Anualidad fija: tasa garantizada, cuenta general, riesgo lo asume la aseguradora. Anualidad icio es el valor nominal MÁS el valor en efectivo acumulado."}, {"t": "Vida entera de prima única", "d": "Un solo pago cubre toda la póliza de por vida; crea valor en efectivo de inmediato."}], "q": [{"q": "El seguro de vida a término nivelado tiene un beneficio por muerte que:", "o": ["Se mantiene igual", "Aumenta", "Disminuye", "Se mantiene solo 2 años"], "a": 0}, {"q": "Rubén, de 25 años, compró una póliza a término decreciente. ¿Qué pasa con la cobertura y las primas?", "o": ["Ambas disminuyen", "Las primas disminuyen, la cobertura se mantiene", "La cobertura disminuye, las primas se mantienen", "Ninguna disminuye"], "a": 2}, {"q": "¿Qué tipo de póliza se garantiza renovable cada año, pero con primas que aumentan?", "o": ["Pago limitado", "Término decreciente", "Término nivelado", "Término anual renovable"], "a": 3}, {"q": "Si el titular renueva una póliza de término renovable, ¿en qué se basa la nueva prima?", "o": ["En la edad cumplida del asegurado", "En una nueva aplicación de asegurabilidad", "En la edad al emitir la póliza original", "En el pago de préstamos pendientes"], "a": 0}, {"q": "El tipo de póliza que puede cambiarse de una sin valor en efectivo a una con valor en efectivo se llama:", "o": ["Póliza a término convertible", "Póliza a término nivelado", "Póliza de vida entera", "Póliza a término renovable"], "a": 0}, {"q": "Nancy tiene una póliza donde, tras 20 años, el valor en efectivo es de $480 por cada $1,000 de cobertura. ¿Qué tipo de póliza es?", "o": ["Seguro de vida entera", "Seguro de vida a término", "Seguro de vida universal", "Seguro con anualidad"], "a": 0}, {"q": "Un pago limitado a 20 años en una póliza de vida entera se completa:", "o": ["A los 65 años del asegurado", "Si el asegurado vive hasta los 100 años", "En la fecha del último pago del plan", "Después de exactamente 20 años"], "a": 3}, {"q": "Si al final del término se le reembolsan al asegurado las primas pagadas, la póliza era probablemente:", "o": ["De término con retorno de DATA.forEach((c,i)=>{
  const d=document.createElement('div'); d.className='card';
  d.innerHTML=`<div class="acc-h">${c.t}<span>${i===0?'−':'+'}</span></div><div class="acc-b${i===0?' open':''}"><ul>${c.b.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  const h=d.querySelector('.acc-h'), body=d.querySelector('.acc-b');

// Tarjetas
const fcSel=document.getElementById('fcChap');
fcSel.innerHTML='<option value="-1">Todos los capítulos</option>'+DATA.map((c,i)=>`<option value="${i}">${c.t}</option>`).join('');
let fcDeck=[],fcIdx=0,fcFlip=false;
function buildDeck(){
  const v=+fcSel.value;
  fcDeck=v===-1?DATA.flatMap(c=>c.f):DATA[v].f;
  fcIdx=0; fcFlip=false; renderFc();
}
function renderFc(){
  if(!fcDeck.length)return;
  const card=fcDeck[fcIdx];
  document.getElementById('fcCard').innerHTML=fcFlip?`<div>${card.d}</div>`:`<div class="term">${card.t}</div>`;
  document.getElementById('fcProg').textContent=`Tarjeta ${fcIdx+1} de ${fcDeck.length} · toca para voltear`;
}
document.getElementById('fcCard').addEventListener('click',()=>{fcFlip=!fcFlip;renderFc();});
document.getElementById('fcNext').addEventListener('click',()=>{fcFlip=false;fcIdx=(fcIdx+1)%fcDeck.length;renderFc();});
document.getElementById('fcPrev').addEventListener('click',()=>{fcFlip=false;fcIdx=(fcIdx-1+fcDeck.length)%fcDeck.length;renderFc();});
fcSel.addEventListener('change',buildDeck);
buildDeck();

// Quiz
const qSel=document.getElementById('qChap');
qSel.innerHTML='<option value="-1">Todos los capítulos</option>'+DATA.map((c,i)=>`<option value="${i}">${c.t}</option>`).join('');
let qSet=[],qIdx=0,qScore=0;
document.getElementById('qStart').addEventListener('click',()=>{
  const v=+qSel.value;
  qSet=(v===-1?DATA.flatMap(c=>c.q):DATA[v].q).slice();
  for(let i=qSet.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qSet[i],qSet[j]]=[qSet[j],qSet[i]];}
  if(v===-1) qSet=qSet.slice(0,85);
  qIdx=0;qScore=0;
  document.getElementById('qSetup').style.display='none';
  document.getElementById('qPlay').style.display='block';
  document.getElementById('qEnd').style.display='none';
  renderQ();
});
function renderQ(){
  const it=qSet[qIdx];
  document.getElementById('qProg').textContent=`Pregunta ${qIdx+1} de ${qSet.length} · Puntaje: ${qScore}`;
  document.getElementById('qText').textContent=it.q;
  const opts=document.getElementById('qOpts'); opts.innerHTML='';
  document.getElementById('qNext').style.display='none';
  it.o.forEach((op,i)=>{
    const b=document.createElement('button'); b.className='qopt'; b.textContent=op;
    b.addEventListener('click',()=>{
      if(b.dataset.done)return;
      [...opts.children].forEach(c=>c.dataset.done='1');
      if(i===it.a){b.classList.add('correct');qScore++;}
      else{b.classList.add('wrong');opts.children[it.a].classList.add('correct');}
      document.getElementById('qNext').style.display='block';
    });
    opts.appendChild(b);
  });
}
document.getElementById('qNext').addEventListener('click',()=>{
  qIdx++;
  if(qIdx>=qSet.length){
    document.getElementById('qPlay').style.display='none';
    document.getElementById('qEnd').style.display='block';
    document.getElementById('qScore').textContent=`Obtuviste ${qScore} de ${qSet.length} correctas`;
  } else renderQ();
});
document.getElementById('qRestart').addEventListener('click',()=>{
  document.getElementById('qEnd').style.display='none';
  document.getElementById('qSetup').style.display='block';
});

// Buscador de palabras clave (sin IA, funciona para cualquiera sin cuenta)
function bdEsc(s){
  const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
}
function bdHighlight(text, term){
  const idx = text.toLowerCase().indexOf(term.toLowerCase());
  if(idx===-1) return bdEsc(text);
  return bdEsc(text.slice(0,idx)) + '<mark>' + bdEsc(text.slice(idx, idx+term.length)) + '</mark>' + bdEsc(text.slice(idx+term.length));
}
function bdSearch(term){
  const t = term.trim().toLowerCase();
  if(!t) return [];
  const results=[];
  DATA.forEach(c=>{
    c.b.forEach(line=>{ if(line.toLowerCase().includes(t)) results.push({chap:c.t, type:'Apunte', text:line}); });
    c.f.forEach(card=>{ if(card.t.toLowerCase().includes(t)||card.d.toLowerCase().includes(t)) results.push({chap:c.t, type:'Tarjeta', text:card.t+': '+card.d}); });
    c.q.forEach(item=>{ if(item.q.toLowerCase().includes(t)) results.push({chap:c.t, type:'Pregunta de quiz', text:item.q}); });
  });
  return results;
}
function bdRender(term){
  const results = bdSearch(term);
  const box = document.getElementById('bdMsgs');
  if(!results.length){
    box.innerHTML = '<div class="card center" style="color:var(--sub)">No encontré resultados para "'+bdEsc(term)+'". Intenta con otra palabra clave.</div>';
    return;
  }
  box.innerHTML = results.slice(0,30).map(r=>
    '<div class="card"><div class="res-tag">'+bdEsc(r.chap)+' · '+r.type+'</div><div style="font-size:.92rem;line-height:1.4">'+bdHighlight(r.text, term)+'</div></div>'
  ).join('');
}
document.getElementById('bdSend').addEventListener('click', ()=>{
  const inp=document.getElementById('bdInput');
  const q=inp.value.trim(); if(!q) return;
  bdRender(q);
});
document.getElementById('bdInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('bdSend').click(); });
</script>
</body>
