<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio Licencia 2-14 Florida</title>
<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#1f2a24; --sub:#5b6b62;
  --line:#e2e1da; --accent:#0d6e4f; --accent2:#c8971f; --bad:#b3413a; --good:#0d6e4f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141814;--card:#1d231d;--ink:#eef0ea;--sub:#9db09f;--line:#2c352c;}
}
:root[data-theme="dark"]{--bg:#141814;--card:#1d231d;--ink:#eef0ea;--sub:#9db09f;--line:#2c352c;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%}
header{padding:18px 16px 10px;text-align:center}
header h1{margin:0;font-size:1.25rem;color:var(--accent)}
header p{margin:4px 0 0;color:var(--sub);font-size:.85rem}
nav{display:flex;gap:6px;padding:8px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;overflow-x:auto}
nav button{flex:1;min-width:90px;padding:9px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:640px;margin:0 auto;padding:10px 14px 40px}
.view{display:none}
.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.acc-h{cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--accent)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .25s ease}
.acc-b.open{max-height:900px;margin-top:8px}
.acc-b ul{margin:0;padding-left:18px}
.acc-b li{margin-bottom:6px;font-size:.92rem;line-height:1.4}
select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px;font-size:.9rem}
.row{display:flex;gap:8px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;font-size:.9rem;cursor:pointer;flex:1}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.gold{background:var(--accent2)}
.fc{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1rem;padding:20px;cursor:pointer}
.fc .term{font-weight:800;color:var(--accent2);font-size:1.05rem}
.qopt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.9rem}
.qopt.correct{background:var(--good);color:#fff;border-color:var(--good)}
.qopt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.progress{font-size:.8rem;color:var(--sub);margin-bottom:6px}
.center{text-align:center}
footer{text-align:center;color:var(--sub);font-size:.75rem;padding:10px}
</style>
</head>
<body>
<header>
<h1>📋 Licencia 2-14 Florida</h1>
<p>Guía, tarjetas y quiz de repaso</p>
</header>
<nav>
<button data-v="guia" class="active">Guía</button>
<button data-v="tarjetas">Tarjetas</button>
<button data-v="quiz">Quiz</button>
<button data-v="buddy">Asistente</button>
</nav>
<main>

<section id="guia" class="view active"></section>

<section id="tarjetas" class="view">
<select id="fcChap"></select>
<div class="card fc" id="fcCard"></div>
<div class="progress center" id="fcProg"></div>
<div class="row" style="margin-top:8px">
<button class="btn ghost" id="fcPrev">← Anterior</button>
<button class="btn" id="fcNext">Siguiente →</button>
</div>
</section>

<section id="quiz" class="view">
<div id="qSetup">
<select id="qChap"></select>
<button class="btn" id="qStart">Comenzar Quiz</button>
</div>
<div id="qPlay" style="display:none">
<div class="progress" id="qProg"></div>
<div class="card">
<div id="qText" style="font-weight:700;margin-bottom:10px"></div>
<div id="qOpts"></div>
</div>
<button class="btn gold" id="qNext" style="display:none">Siguiente →</button>
</div>
<div id="qEnd" style="display:none" class="card center">
<h3 id="qScore"></h3>
<button class="btn" id="qRestart">Repetir</button>
</div>
</section>

<section id="buddy" class="view">
<p style="color:var(--sub);font-size:.85rem;margin-top:0">Hazle preguntas sobre el material del examen 2-14. Responde solo Claude, basado en tus apuntes.</p>
<div class="card" id="bdMsgs" style="min-height:220px;max-height:50vh;overflow-y:auto"></div>
<div id="bdUnavail" style="display:none" class="card center" style="color:var(--sub)">El asistente no está disponible en esta vista.</div>
<div class="row" id="bdRow">
<input id="bdInput" placeholder="Escribe tu pregunta..." style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
<button class="btn" id="bdSend" style="flex:0 0 auto">Enviar</button>
</div>
</section>

</main>
<footer>Material de estudio no oficial · basado en tus apuntes del examen 2-14</footer>
<script>
const DATA=[
{t:"Cap 1 · Solicitud, suscripción y entrega",
b:["Interés asegurable: debe existir al momento de la solicitud, no al momento del fallecimiento.","MIB: organización sin fines de lucro que recopila info médica desfavorable para prevenir fraude.","Garantía = declaración absolutamente verdadera. Representación = verdadera a su leal saber y entender.","Riesgo subestándar = peor que el promedio, primas más altas (calificadas).","Recibo condicional: cobertura inicia el día de la solicitud o el examen médico, el que sea más tarde, si el asegurado califica.","STOLI/IOLI: pólizas compradas para revender con fines de lucro; no existe interés asegurable.","Contrato de adhesión: lo redacta el asegurador; el asegurado solo acepta o rechaza.","Contrato unilateral: solo el asegurador está legalmente obligado a cumplir su promesa."],
f:[{t:"Interés asegurable",d:"Debe existir al solicitar la póliza, no al morir el asegurado."},{t:"MIB",d:"Oficina de Información Médica: comparte datos médicos desfavorables entre aseguradores."},{t:"Garantía",d:"Declaración considerada absolutamente verdadera en la solicitud."},{t:"Representación",d:"Declaración creída verdadera a leal saber y entender."},{t:"Riesgo subestándar",d:"Peor que el promedio; primas más altas."},{t:"Recibo condicional",d:"Cobertura empieza en la fecha de solicitud o examen médico (la más tardía)."},{t:"STOLI/IOLI",d:"Pólizas originadas para vender a inversionistas; no hay interés asegurable real."},{t:"Contrato aleatorio",d:"Intercambio de valores desiguales entre asegurado y asegurador."}],
q:[{q:"La fuente básica de información que se utiliza durante el proceso de aseguramiento es:",o:["La Solicitud","La MIB","El Informe del consumidor","La Declaración del agente"],a:0},
{q:"El MIB es una organización sin fines de lucro que mantiene:",o:["Información sobre conducción de los candidatos","Información médica de los candidatos","Información sobre maternidad de las candidatas","Información sobre los tipos de pólizas disponibles"],a:1},
{q:"Los candidatos cuya salud, hábitos y ocupaciones son de mayor riesgo se denominan:",o:["Riesgos preferenciales","Riesgos menores","Riesgos subestándares","Riesgos no deseados"],a:2},
{q:"Los cambios realizados a una solicitud de seguro de vida deben ser:",o:["Inicializados por el agente solamente","Aprobados por el vicepresidente regional de la compañía","Inicializados por el agente o candidato","Aprobados por los aseguradores"],a:2},
{q:"¿Cuál de los siguientes detalla más claramente el proceso de suscripción para seguros de vida?",o:["Evaluación y clasificación de riesgos","Selección y emisión de pólizas","Selección del riesgo y proceso de clasificación","Selección, informes y rechazo de riesgos"],a:2},
{q:"¿Cuál es la fecha de inicio de cobertura para un candidato que ha recibido un recibo condicional?",o:["La fecha de la aplicación o del examen médico, la más tardía, si es asegurable","La fecha en que el productor recibe la póliza","La fecha en que el asegurador recibe la aplicación","La fecha en que el productor entrega la póliza"],a:0},

{q:"¿Cuándo debe existir un interés asegurable?",o:["Al momento de la aplicación","Cuando el beneficio por fallecimiento se vuelve pagadero","Cuando la titularidad de la póliza es transferida","Cuando se pide un préstamo sobre el valor en efectivo"],a:0},

{t:"Cap 2 · Tipos de pólizas y anualidades",
b:["Término nivelado: beneficio por muerte constante durante el periodo.","Término decreciente: la cobertura disminuye con el tiempo (ideal para hipotecas).","Vida entera: monto nominal, prima y valor en efectivo garantizados hasta los 100 años.","Vida universal: prima y monto nominal flexibles; 2 tasas de interés (mínima garantizada y actual).","Vida variable: valores en cuenta separada, no garantizados; requiere licencia de vida y de valores (FINRA/SEC).","Vida mancomunada (primero en morir) vs vida con supervivencia (último en morir).","Anualidad indexada: interés ligado a un índice (ej. S&P 500) con tasa mínima garantizada.","Anualidad variable: primas invertidas en cuenta separada; requiere doble licencia (seguros y valores)."],

{q:"Rubén, de 25 años, compró una póliza a término decreciente. ¿Qué pasa con la cobertura y las primas?",o:["Ambas disminuyen","Las primas disminuyen, la cobertura se mantiene","La cobertura disminuye, las primas se mantienen","Ninguna disminuye"],a:2},
{q:"¿Qué tipo de póliza se garantiza renovable cada año, pero con primas que aumentan?",o:["Pago limitado","Término decreciente","Término nivelado","Término anual renovable"],a:3},
{q:"Si el titular renueva una póliza de término renovable, ¿en qué se basa la nueva prima?",o:["En la edad cumplida del asegurado","En una nueva aplicación de asegurabilidad","En la edad al emitir la póliza original","En el pago de préstamos pendientes"],a:0},
{q:"El tipo de póliza que puede cambiarse de una sin valor en efectivo a una con valor en efectivo se llama:",o:["Póliza a término convertible","Póliza a término nivelado","Póliza de vida entera","Póliza a término renovable"],a:0},
{q:"Nancy tiene una póliza donde, tras 20 años, el valor en efectivo es de $480 por cada $1,000 de cobertura. ¿Qué tipo de póliza es?",o:["Seguro de vida entera","Seguro de vida a término","Seguro de vida universal","Seguro con anualidad"],a:0},
{q:"Un pago limitado a 20 años en una póliza de vida entera se completa:",o:["A los 65 años del asegurado","Si el asegurado vive hasta los 100 años","En la fecha del último pago del plan","Después de exactamente 20 años"],a:1},
{q:"Si al final del término se le reembolsan al asegurado las primas pagadas, la póliza era probablemente:",o:["De término con retorno de primas","De término convertible","De término decreciente","De vida entera"],a:0},
{q:"Una póliza de vida entera que paga el beneficio al fallecer el PRIMER asegurado se llama:",o:["Seguro de vida universal","Seguro de vida ajustable","Seguro de vida variable","Seguro de vida mancomunado"],a:3},
{q:"Sobre la póliza de seguro de vida entera variable, todas son correctas EXCEPTO:",o:["Proporciona garantía de un beneficio mínimo por fallecimiento","Es básicamente un producto de seguro y de valores","Sus primas y beneficios son variables","Sus valores en efectivo fluctúan con el desempeño de la inversión"],a:2},
{q:"¿Cuál es una diferencia entre el seguro de vida universal y el universal variable?",o:["El valor en efectivo","El monto nominal","El tratamiento tributario","Requiere licencia de vida y de valores"],a:3},

{q:"Todos los siguientes tienen beneficios en vida y fallecimiento, EXCEPTO:",o:["Seguro de vida universal","Seguro de vida universal variable","Seguro de vida a término creciente","Seguro de vida entera con pago limitado"],a:2},
{q:"Todos son parte del periodo de ingreso de una anualidad, EXCEPTO:",o:["Pagos mensuales del pensionado a la anualidad hasta cierta edad","Pagos periódicos al pensionado","Un pago único en suma global al pensionado","Pagos mensuales al beneficiario del pensionado"],a:0},

{q:"¿Qué tipo de anualidad se adquiere con primas múltiples y sus beneficios inician después de un año de la compra?",o:["Inmediata de prima única","Diferida de prima única","Inmediata de prima flexible","Diferida de prima flexible"],a:3},

{q:"Ann, de 25 años, quiere que su anualidad variable rinda igual que el S&P 500. ¿Cuál es el motivo más probable?",o:["Es el único vehículo disponible","Para ajustarse a la inflación","No hay periodo de acumulación","Es regulada por el DFS y la SEC"],a:1},

{t:"Cap 3 · Disposiciones, anexos y exclusiones",
b:["Contrato completo = póliza + copia de solicitud + anexos.","Incontestabilidad: después de 2 años, el asegurador no puede negar el pago por errores en la solicitud (excepto edad/sexo).","Cláusula de suicidio: excluida los primeros 2 años; después se cubre normalmente.","Periodo de gracia en Florida: 30 días para pagar la prima vencida.","Término extendido: opción automática de no caducidad más común.","Beneficiario irrevocable: no se puede cambiar sin su consentimiento por escrito.","Beneficios acelerados: pago anticipado por enfermedad terminal; reduce el beneficio final.","Cláusula de desastre común: se asume que el beneficiario principal murió primero si no se puede determinar el orden."],

q:[{q:"La póliza, copia de la solicitud y anexos forman el:",o:["Contrato de vida entera","Contrato completo/entero","Contrato principal","Contrato de vida completa"],a:1},
{q:"La disposición que impide negar un reclamo por declaraciones engañosas después de cierto tiempo es:",o:["Errores de edad","Incontestabilidad","Reposición","Cláusula de aseguramiento"],a:1},
{q:"La opción de no caducidad que usa el valor en efectivo para comprar el mismo monto nominal, pero a término, es:",o:["Término extendido","Pago reducido","Opción de pago","Monto fijo"],a:0},
{q:"El anexo que ayuda a cubrir gastos mientras el asegurado está en una clínica de reposo es:",o:["Cláusula de aseguramiento","Asegurabilidad garantizada","Reembolso de la prima","Cuidado a largo plazo"],a:3},
{q:"¿Cuál afirmación sobre dividendos de póliza es INCORRECTA?",o:["No son tributables","El asegurador puede garantizarlos","El titular elige cómo recibirlos","Se pagan en pólizas participantes"],a:1}]},

{t:"Cap 4 · Impuestos, jubilación y otros conceptos",
b:["Corredor de viáticos: representa al asegurado (Viator) en la venta de su póliza.","403(b)/TSA: plan calificado para organizaciones sin fines de lucro y escuelas públicas.","El beneficio por muerte pagado en una sola suma no es tributable.","MEC: póliza que no pasa la prueba de los 7 pagos; pierde ventajas tributarias; retiros LIFO; 10% de penalidad antes de los 59½.","IRA tradicional: contribuciones deducibles; distribuciones deben iniciar a los 70½.","IRA Roth: contribuciones después de impuestos; distribuciones libres de impuestos tras los 59½ y 5 años de la cuenta.","Periodo inactivo: entre que el hijo cumple 16 y el cónyuge llega a edad de jubilación, sin beneficios del Seguro Social.","Póliza de persona clave: protege al negocio ante la pérdida de un empleado esencial; el negocio es dueño y beneficiario."],

{q:"El plan de jubilación con beneficios especiales para organizaciones sin fines de lucro y escuelas es:",o:["Keogh/HR10","401(k)","403(b) TSA","SEP"],a:2},

// Guía
const guia=document.getElementById('guia');
DATA.forEach((c,i)=>{
  const d=document.createElement('div'); d.className='card';
  d.innerHTML=`<div class="acc-h">${c.t}<span>${i===0?'−':'+'}</span></div><div class="acc-b${i===0?' open':''}"><ul>${c.b.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  const h=d.querySelector('.acc-h'), body=d.querySelector('.acc-b');

// Tarjetas
const fcSel=document.getElementById('fcChap');
fcSel.innerHTML='<option value="-1">Todos los capítulos</option>'+DATA.map((c,i)=>`<option value="${i}">${c.t}</option>`).join('');
let fcDeck=[],fcIdx=0,fcFlip=false;
function buildDeck(){
  const v=+fcSel.value;
  fcDeck=v===-1?DATA.flatMap(c=>c.f):DATA[v].f;
  fcIdx=0; fcFlip=false; renderFc();
}
function renderFc(){
  if(!fcDeck.length)return;
  const card=fcDeck[fcIdx];
  document.getElementById('fcCard').innerHTML=fcFlip?`<div>${card.d}</div>`:`<div class="term">${card.t}</div>`;
  document.getElementById('fcProg').textContent=`Tarjeta ${fcIdx+1} de ${fcDeck.length} · toca para voltear`;
}
document.getElementById('fcCard').addEventListener('click',()=>{fcFlip=!fcFlip;renderFc();});
document.getElementById('fcNext').addEventListener('click',()=>{fcFlip=false;fcIdx=(fcIdx+1)%fcDeck.length;renderFc();});
document.getElementById('fcPrev').addEventListener('click',()=>{fcFlip=false;fcIdx=(fcIdx-1+fcDeck.length)%fcDeck.length;renderFc();});
fcSel.addEventListener('change',buildDeck);
buildDeck();

// Quiz
const qSel=document.getElementById('qChap');
qSel.innerHTML='<option value="-1">Todos los capítulos</option>'+DATA.map((c,i)=>`<option value="${i}">${c.t}</option>`).join('');
let qSet=[],qIdx=0,qScore=0;
document.getElementById('qStart').addEventListener('click',()=>{
  const v=+qSel.value;
  qSet=(v===-1?DATA.flatMap(c=>c.q):DATA[v].q).slice();
  for(let i=qSet.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qSet[i],qSet[j]]=[qSet[j],qSet[i]];}
  qIdx=0;qScore=0;
  document.getElementById('qSetup').style.display='none';
  document.getElementById('qPlay').style.display='block';
  document.getElementById('qEnd').style.display='none';
  renderQ();
});
function renderQ(){
  const it=qSet[qIdx];
  document.getElementById('qProg').textContent=`Pregunta ${qIdx+1} de ${qSet.length} · Puntaje: ${qScore}`;
  document.getElementById('qText').textContent=it.q;
  const opts=document.getElementById('qOpts'); opts.innerHTML='';
  document.getElementById('qNext').style.display='none';
  it.o.forEach((op,i)=>{
    const b=document.createElement('button'); b.className='qopt'; b.textContent=op;
    b.addEventListener('click',()=>{
      if(b.dataset.done)return;
      [...opts.children].forEach(c=>c.dataset.done='1');
      if(i===it.a){b.classList.add('correct');qScore++;}
      else{b.classList.add('wrong');opts.children[it.a].classList.add('correct');}
      document.getElementById('qNext').style.display='block';
    });
    opts.appendChild(b);
  });
}
document.getElementById('qNext').addEventListener('click',()=>{
  qIdx++;
  if(qIdx>=qSet.length){
    document.getElementById('qPlay').style.display='none';
    document.getElementById('qEnd').style.display='block';
    document.getElementById('qScore').textContent=`Obtuviste ${qScore} de ${qSet.length} correctas`;
  } else renderQ();
});
document.getElementById('qRestart').addEventListener('click',()=>{
  document.getElementById('qEnd').style.display='none';
  document.getElementById('qSetup').style.display='block';
});

// Asistente (study buddy)
const CONTEXT = DATA.map(c=>c.t+": "+c.b.join(" | ")).join("\n");
let sampleFn=null;
(async()=>{
  try{ sampleFn = await claude.use("sample"); }catch(e){ sampleFn=null; }
  if(!sampleFn){
    document.getElementById('bdUnavail').style.display='block';
    document.getElementById('bdRow').style.display='none';
  }
})();
function bdClean(t){
  return (t||'')
    .replace(/\*\*(.*?)\*\*/g,'$1')
    .replace(/\*(.*?)\*/g,'$1')
    .replace(/^[-*]\s+/gm,'• ')
    .replace(/\n{2,}/g,'\n')
    .trim()
    .replace(/\n/g,'<br>');
}
function bdAdd(role,text,raw){
  const d=document.createElement('div');
  d.style.margin='10px 0'; d.style.fontSize='.9rem'; d.style.lineHeight='1.5';
  const label = role==='user' ? '<b>Tú:</b> ' : '<b style="color:var(--accent)">Asistente:</b> ';
  d.innerHTML = label + (raw ? text : bdClean(text));
  document.getElementById('bdMsgs').appendChild(d);
  d.scrollIntoView({block:'end'});
  return d;
}
document.getElementById('bdSend').addEventListener('click', async ()=>{
  if(!sampleFn) return;
  const inp=document.getElementById('bdInput');
  const q=inp.value.trim(); if(!q) return;
  inp.value=''; bdAdd('user',q);
  const ans=bdAdd('assistant','Pensando...',true);
  try{
    const res = await sampleFn(
      "Eres un tutor breve para el examen de licencia de seguros de vida 2-14 de Florida. "+
      "Responde en español, en texto plano sin markdown (sin asteriscos, sin negritas, sin numerales #), "+
      "en frases cortas y directas, máximo 4-5 oraciones, como si hablaras con un estudiante. "+
      "Evita paréntesis largos y notas aclaratorias extra. Basa tu respuesta en este material:\n"+CONTEXT+
      "\n\nPregunta del estudiante: "+q,
      { onText:({text})=>{ ans.innerHTML='<b style="color:var(--accent)">Asistente:</b> '+bdClean(text); } }
    );
    ans.innerHTML='<b style="color:var(--accent)">Asistente:</b> '+bdClean(res.text||'');
  }catch(e){
    ans.innerHTML='<b style="color:var(--accent)">Asistente:</b> No se pudo obtener respuesta ('+(e.code||'error')+'). Intenta de nuevo.';
  }
});
document.getElementById('bdInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('bdSend').click(); });
</script>
